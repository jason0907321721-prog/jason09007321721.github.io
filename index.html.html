<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文化小吃部 - 線上點餐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .banner {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .info {
            font-size: 0.9em;
            opacity: 0.95;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .menu-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .menu-items {
            display: grid;
            gap: 15px;
        }

        .menu-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            gap: 20px;
            align-items: center;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .menu-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .item-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .item-info {
            flex-grow: 1;
        }

        .item-info h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.3em;
        }

        .item-desc {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .item-price {
            color: #f5576c;
            font-weight: bold;
            font-size: 1.2em;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .qty-btn {
            width: 35px;
            height: 35px;
            padding: 0;
            border-radius: 50%;
            font-size: 1.2em;
        }

        .quantity {
            font-weight: bold;
            font-size: 1.1em;
            min-width: 30px;
            text-align: center;
        }

        .cart-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            height: fit-content;
            sticky: top-20px;
        }

        .cart-section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-name {
            font-weight: bold;
            color: #333;
        }

        .cart-item-details {
            color: #666;
            font-size: 0.9em;
        }

        .remove-btn {
            background: #f5576c;
            padding: 5px 15px;
            font-size: 0.9em;
        }

        .remove-btn:hover {
            background: #e04055;
        }

        .cart-total {
            border-top: 2px solid #667eea;
            padding-top: 15px;
            margin-top: 15px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 15px;
            font-size: 1.1em;
            margin-top: 15px;
        }

        .checkout-btn:hover {
            transform: scale(1.02);
        }

        .empty-cart {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="banner.png" alt="文化小吃部橫幅" class="banner">
        <header>
            <h1>🍜 文化小吃部</h1>
            <div class="info">
                <p>📍 臺北市11114陽明山華岡路55號</p>
                <p>📞 123456784</p>
            </div>
        </header>

        <div class="main-content">
            <div class="menu-section">
                <h2>菜單</h2>
                <div class="menu-items" id="menuItems"></div>
            </div>

            <div class="cart-section">
                <h2>🛒 購物車</h2>
                <div class="cart-items" id="cartItems">
                    <div class="empty-cart">購物車是空的</div>
                </div>
                <div class="cart-total" id="cartTotal" style="display: none;">
                    <div class="total-row">
                        <span>總計：</span>
                        <span id="totalAmount">NT$ 0</span>
                    </div>
                    <button class="checkout-btn" onclick="checkout()">確認訂單</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const menuData = [
            { id: 1, name: '牛肉麵', desc: '川味牛肉五塊加上刀切麵', price: 120, img: '牛肉麵.png' },
            { id: 2, name: '牛肉蛋炒飯', desc: '特製黑胡椒牛肩肉炒飯', price: 90, img: '牛肉蛋炒飯.png' },
            { id: 3, name: '台南滷肉飯', desc: '傳統台式滷肉飯加上黃瓜片', price: 50, img: '台南滷肉飯.png' },
            { id: 4, name: '頂級陽春麵', desc: '簡單美味的陽春麵加上一顆龅魚', price: 60, img: '頂級陽春麵.png' },
            { id: 5, name: '功夫麵', desc: '用魚肉製作的麵條加上精燉的豬骨湯', price: 60, img: '功夫麵.png' }
        ];

        let cart = {};

        function renderMenu() {
            const container = document.getElementById('menuItems');
            container.innerHTML = menuData.map(item => `
                <div class="menu-item">
                    <img src="${item.img}" alt="${item.name}" class="item-image">
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <div class="item-desc">${item.desc}</div>
                        <div class="item-price">NT$ ${item.price}</div>
                    </div>
                    <div class="item-actions">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span class="quantity" id="qty-${item.id}">0</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(itemId, change) {
            const item = menuData.find(m => m.id === itemId);
            if (!cart[itemId]) {
                cart[itemId] = { ...item, quantity: 0 };
            }
            
            cart[itemId].quantity += change;
            
            if (cart[itemId].quantity <= 0) {
                delete cart[itemId];
            }
            
            updateDisplay();
        }

        function removeItem(itemId) {
            delete cart[itemId];
            updateDisplay();
        }

        function updateDisplay() {
            // Update menu quantities
            menuData.forEach(item => {
                const qtyEl = document.getElementById(`qty-${item.id}`);
                qtyEl.textContent = cart[item.id]?.quantity || 0;
            });

            // Update cart
            const cartContainer = document.getElementById('cartItems');
            const cartTotalEl = document.getElementById('cartTotal');
            const cartKeys = Object.keys(cart);

            if (cartKeys.length === 0) {
                cartContainer.innerHTML = '<div class="empty-cart">購物車是空的</div>';
                cartTotalEl.style.display = 'none';
            } else {
                cartContainer.innerHTML = cartKeys.map(id => {
                    const item = cart[id];
                    return `
                        <div class="cart-item">
                            <div>
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-details">NT$ ${item.price} × ${item.quantity}</div>
                            </div>
                            <button class="remove-btn" onclick="removeItem(${id})">移除</button>
                        </div>
                    `;
                }).join('');

                const total = cartKeys.reduce((sum, id) => 
                    sum + (cart[id].price * cart[id].quantity), 0);
                
                document.getElementById('totalAmount').textContent = `NT$ ${total}`;
                cartTotalEl.style.display = 'block';
            }
        }

        function checkout() {
            if (Object.keys(cart).length === 0) {
                alert('購物車是空的！');
                return;
            }

            const orderDetails = Object.values(cart).map(item => 
                `${item.name} × ${item.quantity}`
            ).join('\n');
            
            const total = Object.values(cart).reduce((sum, item) => 
                sum + (item.price * item.quantity), 0);

            alert(`訂單確認！\n\n${orderDetails}\n\n總金額：NT$ ${total}\n\n感謝您的訂購！`);
            
            cart = {};
            updateDisplay();
        }

        // Initialize
        renderMenu();
    </script>
</body>
</html>
